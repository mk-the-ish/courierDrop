<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropCity Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>DropCity Admin</h1>
      <section class="card">
        <h2>Privacy Mode</h2>
        <label>
          Backend URL
          <input id="baseUrl" type="text" value="http://localhost:8080" />
        </label>
        <label>
          Admin Token (Bearer)
          <input id="token" type="password" placeholder="Paste Firebase ID token" />
        </label>
        <label>
          Parcel ID
          <input id="parcelId" type="text" placeholder="UUID" />
        </label>
        <div class="toggle-row">
          <label class="toggle">
            <input id="privacyToggle" type="checkbox" checked />
            <span>Privacy Mode Enabled</span>
          </label>
          <button id="applyBtn">Apply</button>
        </div>
        <p id="status" class="status"></p>
      </section>
      <section class="card">
        <h2>Handshake Events</h2>
        <label>
          Parcel ID
          <input id="eventParcelId" type="text" placeholder="UUID" />
        </label>
        <button id="fetchEventsBtn">Fetch Events</button>
        <div id="events" class="events"></div>
      </section>
      <section class="card">
        <h2>Retention Policy</h2>
        <label>
          Retention (days)
          <input id="retentionDays" type="number" value="30" />
        </label>
        <button id="runCleanupBtn">Run Cleanup</button>
        <p id="cleanupStatus" class="status"></p>
      </section>
      <section class="card">
        <h2>System Health</h2>
        <div class="heartbeat-header">
          <button id="fetchHeartbeatsBtn">Refresh Heartbeats</button>
          <span id="heartbeatStatus" class="status"></span>
        </div>
        <div class="heartbeat-legend">
          <span class="legend-pill ok">OK</span>
          <span class="legend-pill warn">Late</span>
          <span class="legend-pill bad">Stuck</span>
        </div>
        <div id="heartbeatList" class="heartbeat-list"></div>
      </section>
      <section class="card">
        <h2>Parcels Overview</h2>
        <div class="parcel-header">
          <button id="fetchParcelsBtn">Refresh Parcels</button>
          <span id="parcelStatus" class="status"></span>
        </div>
        <div class="parcel-filters">
          <label>
            Status
            <select id="parcelStatusFilter">
              <option value="all">All</option>
              <option value="REQUESTED">REQUESTED</option>
              <option value="ASSIGNED">ASSIGNED</option>
              <option value="ACCEPTED">ACCEPTED</option>
              <option value="PINS_SET">PINS_SET</option>
              <option value="IN_TRANSIT">IN_TRANSIT</option>
              <option value="COMPLETED">COMPLETED</option>
            </select>
          </label>
          <label>
            Assignment
            <select id="parcelAssignFilter">
              <option value="all">All</option>
              <option value="assigned">Assigned</option>
              <option value="unassigned">Unassigned</option>
            </select>
          </label>
        </div>
        <div id="parcelList" class="parcel-list"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
